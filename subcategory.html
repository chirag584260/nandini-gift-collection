(() => {
  const photos = document.querySelectorAll('[data-product-photo-source]');
  if (!photos.length) return;
  const dialog = document.createElement('dialog');
  dialog.className = 'product-zoom-dialog';
  dialog.setAttribute('aria-label', 'Product photo viewer');
  dialog.innerHTML = '<div class="product-zoom-shell"><div class="product-zoom-toolbar"><button type="button" aria-label="Close photo viewer" data-photo-action="close">×</button></div><div class="product-zoom-stage"><span class="source-photo-crop-view" role="img"></span></div><div class="product-zoom-controls"><button type="button" aria-label="Zoom out" data-photo-action="out">−</button><span class="product-zoom-level" aria-live="polite">100%</span><button type="button" aria-label="Zoom in" data-photo-action="in">+</button><button type="button" aria-label="Reset zoom" data-photo-action="reset">Reset</button></div></div>';
  document.body.appendChild(dialog);
  const view = dialog.querySelector('.source-photo-crop-view');
  const stage = dialog.querySelector('.product-zoom-stage');
  const level = dialog.querySelector('.product-zoom-level');
  let scale = 1;
  const zoom = (value) => {
    scale = Math.max(1, Math.min(4, value));
    view.style.transform = 'scale(' + scale + ')';
    level.textContent = Math.round(scale * 100) + '%';
  };
  photos.forEach(photo => photo.addEventListener('click', () => {
    view.style.backgroundImage = photo.querySelector('.source-photo-crop-view').style.backgroundImage;
    view.setAttribute('aria-label', photo.getAttribute('aria-label'));
    zoom(1);
    dialog.showModal();
  }));
  dialog.querySelector('[data-photo-action="close"]').onclick = () => dialog.close();
  dialog.querySelector('[data-photo-action="in"]').onclick = () => zoom(scale + .25);
  dialog.querySelector('[data-photo-action="out"]').onclick = () => zoom(scale - .25);
  dialog.querySelector('[data-photo-action="reset"]').onclick = () => zoom(1);
  stage.addEventListener('wheel', event => { event.preventDefault(); zoom(scale + (event.deltaY < 0 ? .2 : -.2)); }, {passive:false});
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
})();
